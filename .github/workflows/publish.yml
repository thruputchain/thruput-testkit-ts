name: Release package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and preview publication without publishing or tagging
        type: boolean
        default: true

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: namespace-profile-hogd-linux-2604
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Read runtime pins
        id: versions
        run: node scripts/integration-config.mjs
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master as of 2026-06
        with:
          toolchain: stable
      - name: Install pinned CLI release
        env:
          CLI_VERSION: ${{ steps.versions.outputs.cli }}
          SOURCE_COMMIT: ${{ steps.versions.outputs.source-commit }}
        run: |
          test -z "$SOURCE_COMMIT" || { echo "Releases require a published CLI pin"; exit 1; }
          cargo install "thruput@$CLI_VERSION" --locked

      - run: npm ci

      # Same checks as CI. A release is dispatched manually and can run on a
      # commit that CI did not cover, so it verifies again.
      - run: npm run format:check
      - run: npm run docs:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - run: npm run test:integration
        env:
          THRUPUT_INTEGRATION_LOG_DIR: ${{ runner.temp }}/testkit-integration

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-integration-logs
          path: ${{ runner.temp }}/testkit-integration
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@thruputchain"

      - name: Publish package to npm
        run: bash scripts/publish-npm.sh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
